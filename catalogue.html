<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="ENRM — Huiles moteur au Maroc. Explorez les références et les formats. Démonstration sans achat réel."
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Toutes les huiles — ENRM</title>
    <link
      rel="preload"
      href="/assets/fonts/inter-tight-1.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/fonts/inter-tight.css" />
    <script type="module" src="/src/storefront/main.ts"></script>
  </head>
  <body data-page="catalogue">
    <!-- layout:header -->
    <main id="main">
      <section class="catalogue section" id="catalogue">
        <div class="section-heading">
          <div>
            <p class="eyebrow">LE CATALOGUE ENRM</p>
            <h1>Votre moteur.<br />Votre référence.</h1>
          </div>
          <p>
            Marques, formulations, grades et formats.<br />Explorez les 210 variantes documentées.
          </p>
        </div>
        <form id="catalogue-filters" action="/catalogue" method="get">
          <div class="catalogue-toolbar">
            <label class="search"
              ><span aria-hidden="true">⌕</span
              ><input
                id="search"
                name="search"
                type="search"
                placeholder="Marque, gamme, 5W-30…"
                aria-label="Rechercher une huile" /></label
            ><button
              type="button"
              id="toggle-filters"
              class="outline"
              aria-controls="filters"
              aria-expanded="false"
            >
              Filtres ＋
            </button>
          </div>
          <div class="catalogue-layout">
            <aside class="filters" id="filters" aria-label="Filtres du catalogue">
              <div class="filter-heading">
                <h2>Affiner la sélection</h2>
                <a class="text-link" id="reset" href="/catalogue">Tout effacer ↺</a>
              </div>
              <label
                >Catégorie<select id="category" name="category">
                  <option value="">Toutes les catégories</option>
                </select></label
              ><label
                >Marque<select id="brand" name="brand">
                  <option value="">Toutes les marques</option>
                </select></label
              ><label
                >Gamme<select id="range" name="range">
                  <option value="">Toutes les gammes</option>
                </select></label
              ><label
                >Viscosité<select id="viscosity" name="viscosity">
                  <option value="">Tous les grades</option>
                </select></label
              ><label
                >Contenance<select id="volume" name="volume">
                  <option value="">Tous les formats</option>
                </select></label
              >
              <button class="button primary" type="submit">Afficher les résultats ↗</button>
            </aside>
            <div class="catalogue-results">
              <div class="results-bar">
                <p id="results-count" role="status"></p>
                <label
                  >Trier par
                  <select id="sort" name="sort">
                    <option value="selection">Sélection ENRM</option>
                    <option value="price-up">Prix croissant</option>
                    <option value="price-down">Prix décroissant</option>
                    <option value="name">Nom A–Z</option>
                  </select></label
                >
              </div>
              <div id="active-filters"></div>
              <div id="product-grid" class="product-grid"></div>
              <div class="load-area">
                <button id="load-more" class="outline">Voir plus de références ↓</button>
                <p class="muted">Prix de démonstration. Disponibilité à confirmer par ENRM.</p>
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>
    <!-- layout:footer --><!-- layout:dialogs -->
  </body>
</html>
